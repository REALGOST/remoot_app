name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Isolated Android Project
        run: |
          # 1. تنظيف السيرفر تماماً
          rm -f build.gradle settings.gradle || true
          rm -rf app || true
          
          # 2. إنشاء الهيكل في مجلد فرعي معزول اسمه 'android_project' لمنع الكاش القديم
          mkdir -p android_project/app/src/main/java/com/remote/streamer
          cp MainActivity.kt android_project/app/src/main/java/com/remote/streamer/ || true
          cp StreamingService.kt android_project/app/src/main/java/com/remote/streamer/ || true
          cp NetworkManager.kt android_project/app/src/main/java/com/remote/streamer/ || true
          
          mkdir -p android_project/app/src/main
          cp AndroidManifest.xml android_project/app/src/main/ || true
          
          # 3. كتابة ملف settings.gradle بنظام البلاجينز الحديث الموحد بالكامل
          echo "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }" > android_project/settings.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }" >> android_project/settings.gradle
          echo "rootProject.name = 'RemoteStreamer'" >> android_project/settings.gradle
          echo "include ':app'" >> android_project/settings.gradle
          
          # 4. ملف build.gradle الرئيسي الموحد
          echo "plugins { id 'com.android.application' version '8.2.0' apply false; id 'org.jetbrains.kotlin.android' version '1.9.0' apply false }" > android_project/build.gradle
          
          # 5. ملف app/build.gradle الداخلي المستقر والصحيح
          echo "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }" > android_project/app/build.gradle
          echo "android {
              compileSdk 34
              namespace 'com.remote.streamer'
              defaultConfig {
                  applicationId 'com.remote.streamer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }" >> android_project/app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3' }" >> android_project/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          cd android_project
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android_project/app/build/outputs/apk/debug/*.apk
