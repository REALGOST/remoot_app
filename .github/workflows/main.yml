name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Isolated Android Project
        run: |
          # 1. إنشاء هيكل المجلدات النظيف والمعزول داخل مجلد مستقل تماماً
          mkdir -p build_dir/app/src/main/java/com/remote/streamer
          mkdir -p build_dir/app/src/main/res/xml
          mkdir -p build_dir/app/src/main/res/values
          
          # 2. نسخ الملفات التي رفعتها أنت يدوياً إلى المجلد المعزول الجديد
          cp NetworkManager.kt build_dir/app/src/main/java/com/remote/streamer/ || true
          cp StreamingService.kt build_dir/app/src/main/java/com/remote/streamer/ || true
          cp MainActivity.kt build_dir/app/src/main/java/com/remote/streamer/ || true
          cp AndroidManifest.xml build_dir/app/src/main/ || true
          
          # 3. كتابة ملف إعدادات المجلدات الأساسي
          echo "rootProject.name = 'RemoteStreamer'" > build_dir/settings.gradle
          echo "include ':app'" >> build_dir/settings.gradle
          
          # 4. كتابة ملف build.gradle الرئيسي الخارجي
          echo "buildscript { ext.kotlin_version = '1.9.0'; repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.2.0'; classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\" } }" > build_dir/build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> build_dir/build.gradle
          
          # 5. كتابة ملف app/build.gradle الداخلي المستقل والصحيح
          echo "apply plugin: 'com.android.application'" > build_dir/app/build.gradle
          echo "apply plugin: 'kotlin-android'" >> build_dir/app/app/build.gradle
          echo "android {
              compileSdk 34
              namespace 'com.remote.streamer'
              defaultConfig {
                  applicationId 'com.remote.streamer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }" >> build_dir/app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.12.0'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.11.0'; implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3' }" >> build_dir/app/build.gradle
          
          # 6. ملفات الإعدادات الإضافية للواجهات
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://google.com" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagDefault" android:canPerformGestures="true" android:description="@string/app_name" />' > build_dir/app/src/main/res/xml/accessibility_service_config.xml
          echo '<resources><string name="app_name">Remote Streamer</string></resources>' > build_dir/app/src/main/res/values/strings.xml

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          cd build_dir
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: build_dir/app/build/outputs/apk/debug/*.apk
