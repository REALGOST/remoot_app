name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project Files
        run: |
          # إنشاء المجلدات للكود في الجذر الرئيسي مباشرة
          mkdir -p src/main/java/com/remote/streamer
          cp MainActivity.kt src/main/java/com/remote/streamer/ || true
          cp StreamingService.kt src/main/java/com/remote/streamer/ || true
          cp NetworkManager.kt src/main/java/com/remote/streamer/ || true
          
          mkdir -p src/main
          cp AndroidManifest.xml src/main/ || true
          
          # 1. ملف settings.gradle التأسيسي البسيط
          echo "rootProject.name = 'RemoteStreamer'" > settings.gradle
          
          # 2. ملف build.gradle الموحد والكامل الذي يحتوي على كل شيء في مكان واحد ليراه السيرفر فوراً
          echo "buildscript {
              ext.kotlin_version = '1.9.0'
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.0'
                  classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\"
              }
          }
          
          allprojects {
              repositories { google(); mavenCentral() }
          }
          
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'
          
          android {
              compileSdk 34
              namespace 'com.remote.streamer'
              
              defaultConfig {
                  applicationId 'com.remote.streamer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }
          
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }" > build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: build/outputs/apk/debug/*.apk
