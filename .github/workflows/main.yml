name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Create Isolated Android Project
        run: |
          rm -f build.gradle settings.gradle || true
          rm -rf app || true
          
          mkdir -p android_project/app/src/main/java/com/remote/streamer
          cp MainActivity.kt android_project/app/src/main/java/com/remote/streamer/ || true
          cp StreamingService.kt android_project/app/src/main/java/com/remote/streamer/ || true
          cp NetworkManager.kt android_project/app/src/main/java/com/remote/streamer/ || true
          
          mkdir -p android_project/app/src/main
          cp AndroidManifest.xml android_project/app/src/main/ || true
          
          # إعداد الـ settings بالطريقة التقليدية الأكثر استقراراً لمنع أي تعارض
          echo "rootProject.name = 'RemoteStreamer'" > android_project/settings.gradle
          echo "include ':app'" >> android_project/settings.gradle
          
          # استخدام إصدار أندرويد 8.1.0 وإصدار كوتلن 1.8.20 (التوليفة الأكثر استقراراً مع جافا 17)
          echo "buildscript { ext.kotlin_version = '1.8.20'; repositories { google(); mavenCentral() }; dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath \"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlin_version\" } }" > android_project/build.gradle
          echo "allprojects { repositories { google(); mavenCentral() } }" >> android_project/build.gradle
          
          echo "apply plugin: 'com.android.application'" > android_project/app/build.gradle
          echo "apply plugin: 'kotlin-android'" >> android_project/app/build.gradle
          echo "android {
              compileSdk 34
              namespace 'com.remote.streamer'
              defaultConfig {
                  applicationId 'com.remote.streamer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              sourceSets {
                  main {
                      java.srcDirs = ['src/main/java']
                      manifest.srcFile 'src/main/AndroidManifest.xml'
                  }
              }
          }" >> android_project/app/build.gradle
          echo "dependencies { implementation 'androidx.core:core-ktx:1.10.1'; implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'com.google.android.material:material:1.9.0'; implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4' }" >> android_project/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: |
          cd android_project
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-apk
          path: android_project/app/build/outputs/apk/debug/*.apk

