workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.remote.streamer"
    scripts:
      - name: Set up local.properties
        script: | 
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: | 
          # هذا الأمر يقوم بتجميع ملف الـ APK النهائي
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "No gradle wrapper found, attempting fallback compilation..."
          fi
    artifacts:
      - app/build/outputs/apk/**/*.apk
